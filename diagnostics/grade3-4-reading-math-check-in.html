  h+='<h2>'+q.q+'</h2>';
  if(q.type==='write'){
    h+='<textarea id="wr" placeholder="Type your answer here..." oninput="saveW()">'+esc(ans[idx]||'')+'</textarea><div class="wc" id="wc"></div>';
  } else {
    var one=q.opts.some(function(o){return o.length>34;});
    h+='<div class="choices'+(one?' one':'')+'">'+q.opts.map(function(o,i){return '<button class="ch'+(ans[idx]===i?' sel':'')+'" onclick="pick('+i+')"><span class="k">'+KEYS[i]+'</span><span>'+o+'</span></button>';}).join('')+'</div>';
  }
  h+='<div class="nav"><button class="back" onclick="go(-1)">Back</button><button class="next" onclick="go(1)">Next</button></div>';
  c.innerHTML=h; if(q.type==='write')saveW(); window.scrollTo(0,0);
}
function start(){name=document.getElementById('nm').value.trim();if(!name){alert('Please type your name first.');return;}if(!t0)t0=new Date();go(1);}
function go(n){stopAudio();idx=Math.max(-1,Math.min(Q.length,idx+n));show();}
function pick(i){ans[idx]=i;document.querySelectorAll('.ch').forEach(function(b,k){b.classList.toggle('sel',k===i);});}
function saveW(){var v=document.getElementById('wr').value;ans[idx]=v;var w=v.trim()?v.trim().split(/\s+/).length:0;document.getElementById('wc').textContent=w+' word'+(w===1?'':'s');}
var au=null;
function stopAudio(){if(au){au.pause();au=null;}}
function play(src,btn){stopAudio();au=new Audio(src);btn.disabled=true;au.onended=function(){btn.disabled=false;};
 au.onerror=function(){btn.disabled=false;document.getElementById('amsg').innerHTML='<div class="amsg">The sound isn’t working right now. Ask a grown-up for help, or tap Next to skip.</div>';};
 au.play().catch(function(){btn.disabled=false;});}
function submitAll(){
  var btn=document.getElementById('sendBtn'),sm=document.getElementById('sm');btn.disabled=true;sm.textContent='Sending...';
  var secs={},log=[],correct=0,mc=0,skipped=[];
  Q.forEach(function(q,i){
    if(!secs[q.sec])secs[q.sec]={c:0,n:0};
    if(q.type==='write')return;
    mc++;secs[q.sec].n++;var a=ans[i];
    var ok=a===q.a; if(ok){correct++;secs[q.sec].c++;}
    if(a===undefined)skipped.push(i+1);
    log.push('Q'+(i+1)+' ['+q.sec+'] '+(a===undefined?'SKIPPED':(ok?'correct':'WRONG'))+' | '+q.plain+' | chose: '+(a===undefined?'-':q.opts[a].replace(/<[^>]+>/g,''))+' | answer: '+q.opts[q.a].replace(/<[^>]+>/g,''));
  });
  var mins=t0?Math.round((new Date()-t0)/60000):0;
  var p={_subject:DATA.subject+' — '+name, student:name, diagnostic:DATA.title, submitted:new Date().toLocaleString('en-US',{timeZone:'America/New_York'})+' ET', minutes_taken:mins,
    score_total:correct+' / '+mc+' ('+Math.round(correct/mc*100)+'%)', skipped:skipped.length?skipped.join(', '):'none'};
  Object.keys(secs).forEach(function(s){if(secs[s].n)p['section: '+s]=secs[s].c+' / '+secs[s].n;});
  Q.forEach(function(q,i){if(q.type==='write'){var v=(ans[i]||'').trim();p[q.key]=v||'(left blank)';p[q.key+' word count']=v?v.split(/\s+/).length:0;}});
  p.answer_log=log.join('\n');
  fetch(DATA.formspree,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(p)})
  .then(function(r){if(!r.ok)throw 0;document.getElementById('card').innerHTML='<h1>All done, '+esc(name.split(' ')[0])+'!</h1><p class="lead">Your answers were sent to Mr. Jonathan. Thank you for working so hard. You can close this page now.</p>';})
  .catch(function(){btn.disabled=false;sm.innerHTML='<span style="color:#DB2F30">Your answers didn’t send. Check the internet connection and tap Send my answers again.</span>';});
}
show();
</script></body></html>
