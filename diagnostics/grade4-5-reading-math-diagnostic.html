<script>var DATA={"title": "Reading & Math Diagnostic \u00b7 Grades 4\u20135", "subject": "KCE Diagnostic (Grades 4\u20135)", "formspree": "https://formspree.io/f/mbglnqqp", "welcome": "<p class=\"lead\">Hi! This diagnostic helps KingCretot Experience learn what you already know in math, reading, and writing, so your lessons start at just the right level. It is not a test you pass or fail.</p><p class=\"lead\">It has six short parts and takes about 40 to 50 minutes. There is no timer, so take your time. If a question is too tricky, it\u2019s okay. Just tap <b>Next</b> and keep going. You can use scratch paper for the math.</p><p class=\"lead\">The last part asks you to write a few sentences. Write in complete sentences and do your best.</p>", "passages": {"vol": {"title": "The Volcano That Wouldn\u2019t Erupt", "text": "Lena had tested her volcano five times at home, and it had erupted perfectly every time. But on the morning of the science fair, nothing happened. She poured in the vinegar, and the baking soda just sat there, fizzing a little like a tired soda.<br><br>Her face turned hot. The judges were walking toward her table. Then she noticed the vinegar bottle. It was the bottle her dad used for cleaning windows, and it was mostly water.<br><br>When the judges arrived, Lena took a deep breath. \u201cMy volcano didn\u2019t work,\u201d she said, \u201cand I think I know why.\u201d She explained how weaker vinegar makes a smaller reaction. The judges listened closely and wrote notes. Lena didn\u2019t win first place, but one judge told her that good scientists often learn the most when an experiment goes wrong."}, "man": {"title": "How Manatees Stay Warm", "text": "Florida manatees are large, slow-moving animals that live in rivers, bays, and coastal waters. Even though they are big, manatees have very little fat to keep them warm. When the water drops below about 68 degrees Fahrenheit, they can get sick from the cold.<br><br>To stay safe in winter, manatees travel to warm water. Many gather at natural springs, where the water stays about 72 degrees all year. Others crowd into the warm water that flows out of power plants along the coast.<br><br>Scientists count manatees each winter by flying over these warm-water places. Because so many manatees gather in the same spots, the counts help scientists learn whether the number of manatees is growing or shrinking."}}, "items": [{"sec": "Math", "q": "In the number 384,917, which digit is in the <b>ten-thousands</b> place?", "opts": ["9", "4", "3", "8"], "a": 3, "type": "mc", "plain": "In the number 384,917, which digit is in the ten-thousands place?"}, {"sec": "Math", "q": "Round 47,862 to the nearest thousand.", "opts": ["50,000", "48,000", "47,900", "47,000"], "a": 1, "type": "mc", "plain": "Round 47,862 to the nearest thousand."}, {"sec": "Math", "q": "3,406 \u2212 1,829 = ?", "opts": ["1,577", "1,587", "2,423", "1,677"], "a": 0, "type": "mc", "plain": "3,406 \u2212 1,829 = ?"}, {"sec": "Math", "q": "9 \u00d7 7 = ?", "opts": ["64", "72", "63", "56"], "a": 2, "type": "mc", "plain": "9 \u00d7 7 = ?"}, {"sec": "Math", "q": "46 \u00d7 23 = ?", "opts": ["230", "1,048", "1,058", "1,158"], "a": 2, "type": "mc", "plain": "46 \u00d7 23 = ?"}, {"sec": "Math", "q": "864 \u00f7 6 = ?", "opts": ["124", "134", "145", "144"], "a": 3, "type": "mc", "plain": "864 \u00f7 6 = ?"}, {"sec": "Math", "q": "What fraction of the bar is shaded?", "opts": ["3/8", "3/5", "8/3", "5/8"], "a": 0, "type": "mc", "plain": "What fraction of the bar is shaded?", "fig": "<svg width=\"310\" height=\"60\" viewBox=\"0 0 310 60\" role=\"img\" aria-label=\"fraction bar\"><rect x=\"5.0\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#0047BA\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"42.5\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#0047BA\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"80.0\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#0047BA\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"117.5\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#fff\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"155.0\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#fff\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"192.5\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#fff\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"230.0\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#fff\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"267.5\" y=\"5\" width=\"37.5\" height=\"50\" fill=\"#fff\" stroke=\"#0A1F3D\" stroke-width=\"3\"/></svg>"}, {"sec": "Math", "q": "Which fraction is equal to 3/4?", "opts": ["3/8", "6/8", "4/3", "6/4"], "a": 1, "type": "mc", "plain": "Which fraction is equal to 3/4?"}, {"sec": "Math", "q": "Which symbol makes this true?  2/3 ___ 3/5", "opts": ["&lt;", "=", "&gt;", "You can\u2019t tell"], "a": 2, "type": "mc", "plain": "Which symbol makes this true? 2/3 ___ 3/5"}, {"sec": "Math", "q": "3/8 + 2/8 = ?", "opts": ["1/8", "6/8", "5/16", "5/8"], "a": 3, "type": "mc", "plain": "3/8 + 2/8 = ?"}, {"sec": "Math", "q": "2/3 + 1/6 = ?", "opts": ["3/6", "5/6", "3/9", "2/18"], "a": 1, "type": "mc", "plain": "2/3 + 1/6 = ?"}, {"sec": "Math", "q": "4 \u00d7 2/3 = ?", "opts": ["2 2/3", "4 2/3", "8/12", "6/3"], "a": 0, "type": "mc", "plain": "4 \u00d7 2/3 = ?"}, {"sec": "Math", "q": "Which decimal is equal to 7/10?", "opts": ["7.0", "0.7", "0.07", "7.10"], "a": 1, "type": "mc", "plain": "Which decimal is equal to 7/10?"}, {"sec": "Math", "q": "Which number is the greatest?", "opts": ["0.5", "0.45", "0.405", "0.09"], "a": 0, "type": "mc", "plain": "Which number is the greatest?"}, {"sec": "Math", "q": "3.25 + 1.8 = ?", "opts": ["3.43", "4.05", "5.05", "5.5"], "a": 2, "type": "mc", "plain": "3.25 + 1.8 = ?"}, {"sec": "Math", "q": "What is the <b>area</b> of the rectangle?", "opts": ["30 square feet", "45 square feet", "15 square feet", "54 square feet"], "a": 3, "type": "mc", "plain": "What is the area of a 9 ft by 6 ft rectangle?", "fig": "<svg width=\"260\" height=\"170\" view ed."], "a": 1, "type": "mc", "plain": "Why can cold water make manatees sick?", "passage": "man"}, {"sec": "Reading", "q": "According to the passage, the water at natural springs stays about", "opts": ["72 degrees all year", "50 degrees all year", "90 degrees all year", "68 degrees all year"], "a": 0, "type": "mc", "plain": "According to the passage, the water at natural springs stays about", "passage": "man"}, {"sec": "Reading", "q": "Why do scientists count manatees at warm-water places?", "opts": ["Manatees only live near power plants.", "The water is too cold for scientists anywhere else.", "So many manatees gather there that they are easier to count.", "Manatees can only be seen at night."], "a": 2, "type": "mc", "plain": "Why do scientists count manatees at warm-water places?", "passage": "man"}, {"sec": "Vocabulary & Word Study", "q": "In the word <b>unhappy</b>, the prefix <i>un-</i> means", "opts": ["very", "before", "again", "not"], "a": 3, "type": "mc", "plain": "In the word unhappy, the prefix un- means"}, {"sec": "Vocabulary & Word Study", "q": "What does <b>reread</b> mean?", "opts": ["to stop reading", "to read out loud", "to read again", "to read slowly"], "a": 2, "type": "mc", "plain": "What does reread mean?"}, {"sec": "Vocabulary & Word Study", "q": "Which word means almost the same as <b>enormous</b>?", "opts": ["huge", "quick", "quiet", "tiny"], "a": 0, "type": "mc", "plain": "Synonym for enormous"}, {"sec": "Vocabulary & Word Study", "q": "Which word means the opposite of <b>ancient</b>?", "opts": ["old", "modern", "broken", "famous"], "a": 1, "type": "mc", "plain": "Antonym of ancient"}, {"sec": "Vocabulary & Word Study", "q": "<i>The trail was so <b>narrow</b> that we had to walk in a single line.</i><br>What does <b>narrow</b> mean?", "opts": ["very long", "crowded", "muddy", "not wide"], "a": 3, "type": "mc", "plain": "Context clue: narrow trail, single line"}, {"sec": "Vocabulary & Word Study", "q": "<i>Dad will <b>park</b> the car near th function go(n){stopAudio();idx=Math.max(-1,Math.min(Q.length,idx+n));show();}
function pick(i){ans[idx]=i;document.querySelectorAll('.ch').forEach(function(b,k){b.classList.toggle('sel',k===i);});}
function saveW(){var v=document.getElementById('wr').value;ans[idx]=v;var w=v.trim()?v.trim().split(/\s+/).length:0;document.getElementById('wc').textContent=w+' word'+(w===1?'':'s');}
var au=null;
function stopAudio(){if(au){au.pause();au=null;}}
function play(src,btn){stopAudio();au=new Audio(src);btn.disabled=true;au.onended=function(){btn.disabled=false;};
 au.onerror=function(){btn.disabled=false;document.getElementById('amsg').innerHTML='<div class="amsg">The sound isn’t working right now. Ask a grown-up for help, or tap Next to skip.</div>';};
 au.play().catch(function(){btn.disabled=false;});}
function submitAll(){
  var btn=document.getElementById('sendBtn'),sm=document.getElementById('sm');btn.disabled=true;sm.textContent='Sending...';
  var secs={},log=[],correct=0,mc=0,skipped=[];
  Q.forEach(function(q,i){
    if(!secs[q.sec])secs[q.sec]={c:0,n:0};
    if(q.type==='write')return;
    mc++;secs[q.sec].n++;var a=ans[i];
    var ok=a===q.a; if(ok){correct++;secs[q.sec].c++;}
    if(a===undefined)skipped.push(i+1);
    log.push('Q'+(i+1)+' ['+q.sec+'] '+(a===undefined?'SKIPPED':(ok?'correct':'WRONG'))+' | '+q.plain+' | chose: '+(a===undefined?'-':q.opts[a].replace(/<[^>]+>/g,''))+' | answer: '+q.opts[q.a].replace(/<[^>]+>/g,''));
  });
  var mins=t0?Math.round((new Date()-t0)/60000):0;
  var p={_subject:DATA.subject+' — '+name, student:name, diagnostic:DATA.title, submitted:new Date().toLocaleString('en-US',{timeZone:'America/New_York'})+' ET', minutes_taken:mins,
    score_total:correct+' / '+mc+' ('+Math.round(correct/mc*100)+'%)', skipped:skipped.length?skipped.join(', '):'none'};
  Object.keys(secs).forEach(function(s){if(secs[s].n)p['section: '+s]=secs[s].c+' / '+secs[s].n;});
  Q.forEach(function(q,i){if(q.type==='write'){var v=(ans[i]||'').trim();p[q.key]=v||'(left blank)';p[q.key+' word count']=v?v.split(/\s+/).length:0;}});
  p.answer_log=log.join('\n');
  fetch(DATA.formspree,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(p)})
  .then(function(r){if(!r.ok)throw 0;document.getElementById('card').innerHTML='<h1>All done, '+esc(name.split(' ')[0])+'!</h1><p class="lead">Your answers were sent to KingCretot Experience. Thank you for working so hard. You can close this page now.</p>';})
  .catch(function(){btn.disabled=false;sm.innerHTML='<span style="color:#DB2F30">Your answers didn’t send. Check the internet connection and tap Send my answers again.</span>';});
}
show();
</script></body></html>
